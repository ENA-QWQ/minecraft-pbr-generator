global:
  seed: 11451
  featureDim: 100
  labelDim: 5
  patchSize: 5

datasetBuilder:
  inputDir: "./resourcepacks"
  outputDir: "./dataset"
  maxSamples: 120000
  targetTextureSize: 128
  normalOverflowRatio: 0.5

training:
  dataPath: "./dataset/train_data.bin"
  labelPath: "./dataset/train_labels.bin"
  modelOutput: "./height_model.ser"
  totalSamples: 120000
  trainSplit: 100000
  valSplit: 20000
  hyperparams:
    batchSize: 128
    epochs: 100
    patience: 8
    learningRate: 0.005
    lrDecay: 0.95
    lrStep: 10
    layers: [100, 32, 16, 1]

inference:
  modelPath: "./height_model.ser"
  outputDir: "./output"
  normalStrength: 8.0
  pixelate: false
  baseSmoothness: 0.3
  baseMetallic: 0.1
  height:
    invert: true
    strength: 1.5
    min: 0.1
    max: 1.0
    smoothRadius: 4
    normPercentile: 1.5
  normal:
    invertY: true